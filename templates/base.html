<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ config.title }}{% endblock title %}</title>
  <meta name="description" content="{% block description %}{{ config.description }}{% endblock description %}">
  <meta property="og:image" content="{% block og_image %}{{ config.extra.og_image }}{% endblock og_image %}">
  <link rel="icon" href="/favicon.ico" sizes="any">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="alternate" type="application/rss+xml" title="RSS" href="{{ get_url(path="rss.xml") }}">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=JetBrains+Mono:wght@400;500&family=Source+Serif+4:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="wrap">
    <main class="main">
      <div class="nav-slot">
        {% include "partials/nav.html" %}
      </div>
      <div class="content-slot">
        {% block content %}{% endblock content %}
      </div>
    </main>
  </div>

  <script defer src="/_vercel/insights/script.js"></script>
  <script src="/js/back-to-top.js" defer></script>
  {% block extra_js %}{% endblock extra_js %}
</body>
</html>
